name: Build

on:
  push:
    branches:
      - arena/01a087ce-killauraclient
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Show Java and wrapper info
        run: |
          java -version
          ls -la gradle/wrapper
          sed -n '1,120p' gradle/wrapper/gradle-wrapper.properties

      - name: Build
        id: gradle-build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Report Gradle failure
        if: steps.gradle-build.outcome == 'failure'
        run: |
          echo '--- Gradle build log tail ---'
          tail -160 gradle-build.log
          MESSAGE=$(tail -40 gradle-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-3500)
          echo "::error title=Gradle build failed::$MESSAGE"
          exit 1

      - name: Upload mod jars
        if: steps.gradle-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: KillAuraClient-jars
          path: build/libs/*.jar
