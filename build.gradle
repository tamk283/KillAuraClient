plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

// Java версия для максимальной совместимости с мобильными лаунчерами
sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

version = '1.0.0-mobile'
group = 'com.example.killaura'

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.4"
    mappings "net.fabricmc:yarn:1.21.4+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.109.1+1.21.4"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}

// Оптимизация для мобильных устройств
tasks.register('optimizedJar', Jar) {
    from sourceSets.main.output
    archiveBaseName = 'KillAuraClient-mobile'
    archiveVersion = version
    
    // Исключаем лишние файлы для уменьшения размера
    exclude 'META-INF/maven/**'
    exclude '**/*.kotlin_module'
    exclude '**/*.kotlin_builtins'
    
    manifest {
        attributes 'Implementation-Title': 'KillAura Mobile',
                   'Implementation-Version': version,
                   'Specification-Title': 'KillAura',
                   'Specification-Version': version
    }
}

// Задача для сборки мобильной версии
tasks.register('buildMobile') {
    dependsOn 'optimizedJar', 'build'
    doLast {
        println "KillAura Mobile build completed!"
        println "Artifacts:"
        println "  - build/libs/KillAuraClient-mobile-${version}.jar (оптимизированная версия)"
        println "  - build/libs/KillAuraClient-${version}.jar (стандартная версия)"
    }
}

// Настройки для PojavLauncher и других мобильных лаунчеров
ext {
    // Настройки для мобильных устройств
    isMobileOptimized = true
    enableMobileFeatures = true
}
